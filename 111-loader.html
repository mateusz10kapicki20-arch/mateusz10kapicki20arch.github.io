<!DOCTYPE html>
<head>
<title>Play This!</title>
<meta content="noindex,nofollow" name="robots">
<base target="_top">

<link href="playpipstyle.css" rel="stylesheet">

</head>

<body>
<form name="passingForm">
<input type="hidden" name="fieldOne">
<input type="hidden" name="fieldTwo">
</form>

<a href="#" id="backContainer" onclick="window.history.back()"><img src="backButtonMin.svg" alt="Back" style="width:100px;height:100px;"></a>

<script>

var formName = "passingForm",
  query = location.href.split("?").pop().split("&"),
  i = 0,
  len = query.length,
  split, elem;

  for ( ; i < len; i++ ) {
      game = query[i].split("=");

      elem = document[formName][game[0]];

      if ( elem ) {
          elem.value = game[1].replace(/"/g, '\\"');
      }
  }

var data = game[0].split(',')

var gameName = data[0].replace(/-/g, " ");

document.title = gameName;

if(data[1]){
document.write('<iframe id=gameFrame src="https://html5.gamedistribution.com/'+data[1]+'/" scrolling="none" frameborder="0"></iframe>')
}

var gameType="HTML5";
var block="GD";
var GAstring=gameName+" - "+gameType+" Game - Block "+block+" - ";
var GAstringL=GAstring+"Loading !01 !05 !10 !15 !20";
var GAstring1=GAstring+"!01 minute";
var GAstring5=GAstring+"!05 minutes";
var GAstring10=GAstring+"!10 minutes";
var GAstring15=GAstring+"!15 minutes";
var GAstring20=GAstring+"!20 minutes";
(function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
(i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
})(window,document,'script','//https://www.google-analytics.com/analytics.js','ga');
ga('create', 'UA-3596694-8', 'auto');
ga('send', 'pageview');
function loading(){ga('send', 'event', 'Gameplay', GAstringL);}
function oneMin(){ga('send', 'event', 'Gameplay', GAstring1);}
function fiveMins(){ga('send', 'event', 'Gameplay', GAstring5);}
function tenMins(){ga('send', 'event', 'Gameplay', GAstring10);}
function fifteenMins(){ga('send', 'event', 'Gameplay', GAstring15);}
function twentyMins(){ga('send', 'event', 'Gameplay', GAstring20);}
setTimeout(loading, 1000);setTimeout(oneMin, 60000);
setTimeout(fiveMins, 300000);
setTimeout(tenMins, 600000);
setTimeout(fifteenMins, 900000);
setTimeout(twentyMins, 1200000);
</script>

</body> 
</html>
